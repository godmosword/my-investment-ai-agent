name: Options Flow + GEX Tick

# 每日抓 Polygon options snapshots/trades，計算 Unusual Flow + GEX，
# 寫入 BigQuery 歷史並印出結構化摘要（供 Telegram / Agent 後續消費）。
#
# 預設啟用排程（美股收盤後，UTC 22:30 ≈ ET 17:30/18:30 視 DST）。
# 暫停：GitHub → Settings → Variables 設 OPTIONS_FLOW_ENABLED=0（job skip，不算失敗）。
# 需要 secrets：POLYGON_API_KEY（必要）；BigQuery 寫入需 GCP 認證（未設則 SKIP_BIGQUERY=1 降級）。

on:
  schedule:
    - cron: '30 22 * * 1-5'   # 週一至週五 22:30 UTC
  workflow_dispatch:
    inputs:
      watchlist:
        description: '空白＝用預設半導體清單；或填逗號分隔代號（如 MU,NVDA,AMD）'
        required: false
        default: ''

concurrency:
  group: options-flow-tick
  cancel-in-progress: false

jobs:
  tick:
    if: vars.OPTIONS_FLOW_ENABLED != '0'
    runs-on: ubuntu-22.04

    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      # 未配置 GCP 認證時，設 SKIP_BIGQUERY=1 讓管線只印摘要、不寫 BQ。
      SKIP_BIGQUERY: ${{ vars.OPTIONS_FLOW_SKIP_BIGQUERY || '1' }}
      OPTIONS_WATCHLIST: ${{ github.event.inputs.watchlist }}
      # BigQuery 表名（設定後才寫入；空字串＝略過）。
      OPTIONS_SNAPSHOTS_TABLE: ${{ vars.OPTIONS_SNAPSHOTS_TABLE }}
      OPTIONS_UNUSUAL_TRADES_TABLE: ${{ vars.OPTIONS_UNUSUAL_TRADES_TABLE }}
      OPTIONS_GEX_HISTORY_TABLE: ${{ vars.OPTIONS_GEX_HISTORY_TABLE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-options-tick.txt

      - name: Install options tick dependencies
        run: pip install --no-cache-dir -r requirements-options-tick.txt

      - name: Run options flow + GEX tick
        run: python3 scripts/options_flow_tick.py
