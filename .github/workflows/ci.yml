name: CI — Lint & Test

# - PR：一律跑（Required checks）
# - workflow_call：給 deploy.yml 在 main push / manual deploy 時重用同一套 Lint+Test
#   （避免 main push 時「ci.yml + deploy.yml」各跑一次造成重複計算）
on:
  pull_request:
  workflow_call:

jobs:
  quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # 釋放預裝大型 SDK（dotnet/android 等），避免 CrewAI 依賴裝滿 14GB 碟
      - name: Free disk space on runner
        run: |
          set -eux
          sudo docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run smoke tests
        run: pytest -m smoke -q --tb=short

  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Free disk space on runner
        run: |
          set -eux
          sudo docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run full tests
        run: pytest -v --tb=short
