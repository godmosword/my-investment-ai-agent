name: CI — Lint & Test

# - PR：一律跑（Required checks）
# - push main：僅在會影響執行檔／依賴時跑（與過去 deploy 的 paths 對齊），純文件 merge 省分鐘數
# - workflow_call：給 deploy.yml 手動部署前重用同一套 Lint+Test
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "assets_config.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
  workflow_call:

jobs:
  quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run smoke tests
        run: pytest -m smoke -q --tb=short

  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run full tests
        run: pytest -v --tb=short
