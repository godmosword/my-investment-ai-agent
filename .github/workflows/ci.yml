name: CI — Lint & Test

# - PR：略過僅 docs/ 或 data-verification-ui/ 的變更（純文件／PWA 不跑 Python CI）。
#   根目錄 *.md 仍會觸發，避免 branch protection 在「僅改 README」時缺少 required check。
# - workflow_dispatch：手動「Run workflow」觸發（與 deploy 同級 smoke / 可選 full）
# - workflow_call：由 deploy / nightly 呼叫；test_tier=quick 僅 smoke，full 跑全套件
# - 依賴 requirements-ci.txt（無 CrewAI 等），顯著縮短 pip 與磁碟占用
on:
  workflow_dispatch:
    inputs:
      test_tier:
        description: "quick = pytest -m smoke; full = pytest -v"
        type: choice
        options:
          - quick
          - full
        default: quick
  pull_request:
    paths-ignore:
      - "docs/**"
      - "data-verification-ui/**"
  workflow_call:
    inputs:
      test_tier:
        description: "quick = pytest -m smoke; full = pytest -v"
        type: string
        default: full

jobs:
  quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: pip install --no-cache-dir -r requirements-ci.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run smoke tests
        run: pytest -m smoke -q --tb=short

      - name: Set up Node.js (PWA / Terminal contract)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: data-verification-ui/package.json

      - name: Terminal contract (quote vs OHLC + PWA build)
        run: ./scripts/ci_terminal_contract_check.sh

      - name: Run mock smoke (MOCK_APIS=1)
        run: ./scripts/run_mock_smoke.sh

  # 可重用 workflow 內 github.event_name 繼承「呼叫端」事件（如 push／schedule），
  # 不會是 workflow_call；故用「非 PR」判斷，讓 deploy／nightly 的 uses: 本檔時會實際跑測。
  callable:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    env:
      # workflow_dispatch 無 workflow_call 的 inputs 脈絡，改讀 github.event.inputs
      CI_TEST_TIER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_tier || inputs.test_tier }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # full 仍可能拉較多快取／artifact；quick 略過以省 ~30s
      - name: Free disk space on runner
        if: env.CI_TEST_TIER == 'full'
        run: |
          set -eux
          sudo docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: pip install --no-cache-dir -r requirements-ci.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests (tier ${{ env.CI_TEST_TIER }})
        run: |
          if [ "${CI_TEST_TIER}" = "full" ]; then
            pytest -v --tb=short
          else
            pytest -m smoke -q --tb=short
          fi

      - name: Set up Node.js (PWA / Terminal contract)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: data-verification-ui/package.json

      - name: Terminal contract (quote vs OHLC + PWA build)
        run: ./scripts/ci_terminal_contract_check.sh

      - name: Run mock smoke (MOCK_APIS=1)
        if: env.CI_TEST_TIER == 'quick'
        run: ./scripts/run_mock_smoke.sh
