# OSS Scout：每週搜尋 GitHub → digest → 改版計畫 → 合併至 TODOS.md（可手動重跑）
# 需 contents:write 以 push 候選 JSON／研究稿／TODOS 更新。
name: weekly-scout-candidates

on:
  workflow_dispatch: {}
  schedule:
    # 每月 1 日與 15 日 06:00 UTC（約雙週頻率，較原每週一省 Actions 分鐘）
    - cron: "0 6 1,15 * *"

permissions:
  contents: write

concurrency:
  group: weekly-scout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: pip install --no-cache-dir jinja2

      - name: OSS weekly pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOUT_SORT: stars
          SCOUT_PER_PAGE: "15"
        run: python scripts/oss_weekly_pipeline.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oss-scout-${{ github.run_id }}
          path: |
            docs/oss_candidates/*-candidates.json
            docs/oss_candidates/*-digest.json
            docs/oss_candidates/*-revision-plan-draft.md
          if-no-files-found: warn

      - name: Commit and push TODOS + candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/oss_candidates TODOS.md
          if git diff --staged --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "chore(oss-scout): weekly candidates $(date -u +%F)"
            git push
          fi
