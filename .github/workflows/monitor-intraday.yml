name: Monitor — Intraday BTC/VIX Anomaly

# 盤中檢查 BTC 1h 漲跌與 VIX；觸發 Telegram + BigQuery（靜默期見 vars）。
# pip 使用 requirements-monitor.txt（無 CrewAI）。
#
# 排程預設關閉：避免 main 上 cron 持續佔用 Actions 分鐘／通知疲勞。
# 需要自動巡檢時二選一：
#   1) Actions → 本 workflow → Run workflow（手動）
#   2) 取消下方 schedule 註解（例：每 2 小時 UTC 整點）
on:
  # schedule:
  #   - cron: '0 */2 * * *'   # 每 2 小時整點（UTC）；約 12 次/日
  workflow_dispatch:

concurrency:
  group: intraday-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-22.04

    env:
      GCP_PROJECT_ID:             ${{ secrets.GCP_PROJECT_ID }}
      TELEGRAM_BOT_TOKEN:         ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:           ${{ secrets.TELEGRAM_CHAT_ID }}
      XAI_API_KEY:                ${{ secrets.XAI_API_KEY }}
      OPENAI_API_KEY:             ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY:         ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY:             ${{ secrets.GEMINI_API_KEY }}
      APIFY_API_TOKEN:            ${{ secrets.APIFY_API_TOKEN }}
      COINGLASS_API_KEY:          ${{ secrets.COINGLASS_API_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_SA_KEY }}
      # Tunable via repository variables or secrets
      INTRADAY_SILENCE_HOURS:     ${{ vars.INTRADAY_SILENCE_HOURS || '8' }}
      INTRADAY_BTC_PCT_THRESHOLD: ${{ vars.INTRADAY_BTC_PCT_THRESHOLD || '8.0' }}
      INTRADAY_VIX_THRESHOLD:     ${{ vars.INTRADAY_VIX_THRESHOLD || '36.0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Free disk space on runner
        run: |
          set -eux
          sudo docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-monitor.txt

      - name: Install monitor dependencies
        run: pip install --no-cache-dir -r requirements-monitor.txt

      - name: Write GCP credentials file
        if: ${{ env.GOOGLE_APPLICATION_CREDENTIALS_JSON != '' }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcp_sa_key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_sa_key.json" >> "$GITHUB_ENV"

      - name: Run intraday monitor
        run: python monitor_intraday.py
