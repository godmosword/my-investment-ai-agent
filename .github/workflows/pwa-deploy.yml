# PWA: lint → build → E2E. Deploy step is maintainer-specific (secrets + host).
name: PWA deploy

on:
  push:
    branches: [main]
    paths:
      - "data-verification-ui/**"
      - ".github/workflows/pwa-deploy.yml"
  workflow_dispatch:

concurrency:
  group: pwa-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-verification-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: data-verification-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (E2E bundle)
        env:
          VITE_E2E: "1"
        run: npm run build

      - name: E2E
        run: npm run test:e2e

  # TODO(maintainer): wire static host (Cloudflare Pages / Firebase / GCS+LB / GitHub Pages).
  # Required: repository secrets for provider token + project/bucket id. Do not deploy to the wrong target.
  deploy-placeholder:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy (not configured)
        run: |
          echo "pwa-deploy: verify job passed. Add deploy steps + secrets when hosting is chosen."
          echo "See docs/PORTAL_SHIP_CHECKLIST.md and data-verification-ui/.env.example."
