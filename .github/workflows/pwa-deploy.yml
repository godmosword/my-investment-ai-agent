# PWA: lint → build → E2E → Vercel deploy (production on main).
name: PWA deploy

on:
  push:
    branches: [main]
    paths:
      - "data-verification-ui/**"
      - ".github/workflows/pwa-deploy.yml"
  workflow_dispatch:

concurrency:
  group: pwa-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-verification-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: data-verification-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (E2E bundle)
        env:
          VITE_E2E: "1"
        run: npm run build

      - name: E2E
        run: npm run test:e2e

  deploy-vercel:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: data-verification-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: data-verification-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (production)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TECH_PULSE_URL: ${{ secrets.VITE_TECH_PULSE_URL }}
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
