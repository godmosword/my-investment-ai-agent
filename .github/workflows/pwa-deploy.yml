# PWA: lint → E2E → Vercel deploy (production on main).
name: PWA deploy

on:
  push:
    branches: [main]
    paths:
      - "data-verification-ui/**"
      - ".github/workflows/pwa-deploy.yml"
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: "Skip Playwright E2E (emergency deploy only)"
        type: boolean
        default: false

concurrency:
  group: pwa-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 35
    runs-on: ubuntu-22.04
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    defaults:
      run:
        working-directory: data-verification-ui
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: data-verification-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: E2E
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_e2e }}
        env:
          CI: true
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure() && (github.event_name != 'workflow_dispatch' || !inputs.skip_e2e)
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            data-verification-ui/playwright-report/
            data-verification-ui/e2e-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy-vercel:
    needs: verify
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    environment: production
    defaults:
      run:
        working-directory: data-verification-ui
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: data-verification-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (production)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TECH_PULSE_URL: ${{ secrets.VITE_TECH_PULSE_URL }}
        run: npm run build

      - name: Deploy to Vercel
        working-directory: .
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TECH_PULSE_URL: ${{ secrets.VITE_TECH_PULSE_URL }}
        run: |
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "::warning::Vercel deploy skipped — set GitHub secrets VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID (see docs/PORTAL_SHIP_CHECKLIST.md)."
            exit 0
          fi
          if [ -z "${VITE_API_URL}" ]; then
            echo "::error::VITE_API_URL secret is required when Vercel deploy is configured (FastAPI base URL baked into production bundle)."
            exit 1
          fi
          # Vercel project Root Directory is data-verification-ui; run CLI from repo root.
          # npm run build dist/ is fail-fast only; deploy artifact is vercel build output.
          test -f data-verification-ui/dist/index.html
          npx vercel@54.14.2 pull --yes --environment=production --token="${VERCEL_TOKEN}"
          npx vercel@54.14.2 build --prod --token="${VERCEL_TOKEN}"
          if [ ! -f .vercel/output/config.json ] && [ ! -f .vercel/output/static/index.html ]; then
            echo "::error::vercel build did not produce .vercel/output (missing config.json and static/index.html). Check Vercel Root Directory=output settings; see docs/PORTAL_SHIP_CHECKLIST.md troubleshooting."
            exit 1
          fi
          npx vercel@54.14.2 deploy --prebuilt --prod --yes --token="${VERCEL_TOKEN}"
