# PWA: lint → build → E2E → Vercel deploy (production on main).
name: PWA deploy

on:
  push:
    branches: [main]
    paths:
      - "data-verification-ui/**"
      - ".github/workflows/pwa-deploy.yml"
  workflow_dispatch:

concurrency:
  group: pwa-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: data-verification-ui
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: data-verification-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (E2E bundle)
        env:
          VITE_E2E: "1"
        run: npm run build

      - name: E2E
        run: npm run test:e2e

  deploy-vercel:
    needs: verify
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: data-verification-ui
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: data-verification-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (production)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TECH_PULSE_URL: ${{ secrets.VITE_TECH_PULSE_URL }}
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "::warning::Vercel deploy skipped — set GitHub secrets VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID (see docs/PORTAL_SHIP_CHECKLIST.md)."
            exit 0
          fi
          npx vercel deploy dist --prod --yes --token "${VERCEL_TOKEN}"
