name: Crypto Agent Daily Report

on:
  workflow_dispatch:
  schedule:
    # UTC 時間 23:45 = 台灣時間早上 07:45
    - cron: '45 23 * * *'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Docker Compose
        env:
          # 加入 OPENROUTER_API_KEY，並移除舊的個別模型金鑰
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          CRYPTOQUANT_API_KEY: ${{ secrets.CRYPTOQUANT_API_KEY }} # 或是 - CRYPTOQUANT_API_KEY=${CRYPTOQUANT_API_KEY}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: docker compose up --build --exit-code-from investment-agent
