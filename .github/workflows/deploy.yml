name: Deploy — Cloud Run Job

# - push main：變更執行相關檔案時自動部署（paths 與 ci.yml 對齊，純文件不觸發）
# - workflow_dispatch：隨時手動部署（仍先跑 ci.yml）
# 流程：先跑可重用的 ci.yml（Lint+Test），通過後才 build/push/deploy。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "requirements-ci.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "assets_config.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/nightly-ci.yml"

# true：連續 push 只保留最新一次完整 deploy，節省 Actions 分鐘（進行中 run 會被取消）。
concurrency:
  group: deploy-main-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID:    ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION:        asia-east1
  CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE || 'my-investment-ai-agent' }}
  GAR_REPOSITORY:    ${{ secrets.GAR_REPOSITORY }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    with:
      test_tier: quick

  build-and-deploy:
    needs: [test]
    runs-on: ubuntu-22.04
    # 於 GitHub Repo → Settings → Environments → production 設定 Required reviewers 後，
    # 本 job 會在部署前等待人工核准（阻斷「綠 CI 即上線」）。
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Free disk space on runner
        run: |
          set -eux
          sudo docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6df18f # v3.11.1

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune local Docker (runner disk)
        run: |
          docker builder prune -af || true
          docker system prune -af || true
          df -h

      - name: Deploy to Cloud Run Job
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        run: |
          # Secret Manager 金鑰已由上一步驟同步；映像以當前 commit SHA 為準。
          SECRETS="XAI_API_KEY=XAI_API_KEY:latest"
          SECRETS="$SECRETS,OPENAI_API_KEY=OPENAI_API_KEY:latest"
          SECRETS="$SECRETS,OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest"
          SECRETS="$SECRETS,GEMINI_API_KEY=GEMINI_API_KEY:latest"
          SECRETS="$SECRETS,APIFY_API_TOKEN=APIFY_API_TOKEN:latest"
          SECRETS="$SECRETS,TAVILY_API_KEY=TAVILY_API_KEY:latest"
          SECRETS="$SECRETS,X_BEARER_TOKEN=X_BEARER_TOKEN:latest"
          SECRETS="$SECRETS,COINGLASS_API_KEY=COINGLASS_API_KEY:latest"
          SECRETS="$SECRETS,CRYPTOQUANT_API_KEY=CRYPTOQUANT_API_KEY:latest"
          SECRETS="$SECRETS,FRED_API_KEY=FRED_API_KEY:latest"
          SECRETS="$SECRETS,FINANCIAL_DATASETS_API_KEY=FINANCIAL_DATASETS_API_KEY:latest"
          SECRETS="$SECRETS,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest"
          SECRETS="$SECRETS,TELEGRAM_CHAT_ID=TELEGRAM_CHAT_ID:latest"

          # 若這些金鑰先前是以普通 env var 形式存在，先移除以允許升級為 secret 型態。
          # 注意：首次部署時不要加 --remove-env-vars，否則會因變數尚不存在而失敗。
          # 後續更新若要清除舊的明文 env var，可取消下方 REMOVE_VARS 與對應參數的註解。
          # REMOVE_VARS="XAI_API_KEY,OPENAI_API_KEY,OPENROUTER_API_KEY,GEMINI_API_KEY"
          # REMOVE_VARS="$REMOVE_VARS,TAVILY_API_KEY,X_BEARER_TOKEN,COINGLASS_API_KEY"
          # REMOVE_VARS="$REMOVE_VARS,CRYPTOQUANT_API_KEY,FRED_API_KEY,FINANCIAL_DATASETS_API_KEY"
          # REMOVE_VARS="$REMOVE_VARS,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID"

          # 日報管線含雙 Crew、多輪 LLM 與重試，實測常超過 1h；3600s 會被 Cloud Run 硬殺。
          # Cloud Run Jobs 單一 task 上限可至 168h；此處 4h 為安全預設，仍不足可再調高。
          gcloud run jobs deploy "${CLOUD_RUN_SERVICE}" \
            --image "$IMAGE_URI" \
            --region "${{ env.GCP_REGION }}" \
            --service-account="${{ secrets.GCP_RUNTIME_SA_EMAIL }}" \
            --cpu 2 \
            --memory 2Gi \
            --task-timeout 14400 \
            --set-secrets="$SECRETS" \
            --quiet
