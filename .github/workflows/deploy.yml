name: CI/CD to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GCP_PROJECT_ID:    ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION:        asia-east1
  CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
  GAR_REPOSITORY:    ${{ secrets.GAR_REPOSITORY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Enable required GCP APIs
        run: |
          gcloud services enable secretmanager.googleapis.com --quiet
          gcloud services enable run.googleapis.com --quiet
          gcloud services enable artifactregistry.googleapis.com --quiet

      - name: Sync API keys to Secret Manager
        env:
          XAI_API_KEY:          ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY:       ${{ secrets.TAVILY_API_KEY }}
          X_BEARER_TOKEN:       ${{ secrets.X_BEARER_TOKEN }}
          COINGLASS_API_KEY:    ${{ secrets.COINGLASS_API_KEY }}
          CRYPTOQUANT_API_KEY:  ${{ secrets.CRYPTOQUANT_API_KEY }}
          FRED_API_KEY:         ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 將 GitHub Secrets 的值同步進 GCP Secret Manager。
          # 若 secret 不存在則建立，若已存在則新增一個版本（自動成為 latest）。
          _upsert_secret() {
            local NAME="$1"
            local VALUE="$2"
            if [ -z "$VALUE" ]; then
              echo "⚠️  Skipping ${NAME}: GitHub Secret is empty or not set."
              return
            fi
            if gcloud secrets describe "$NAME" --project="${GCP_PROJECT_ID}" &>/dev/null; then
              echo "$VALUE" | gcloud secrets versions add "$NAME" \
                --data-file=- --project="${GCP_PROJECT_ID}" --quiet
              echo "✅ Updated secret: ${NAME}"
            else
              echo "$VALUE" | gcloud secrets create "$NAME" \
                --data-file=- --replication-policy=automatic \
                --project="${GCP_PROJECT_ID}" --quiet
              echo "✅ Created secret: ${NAME}"
            fi
          }

          _upsert_secret XAI_API_KEY         "$XAI_API_KEY"
          _upsert_secret OPENAI_API_KEY       "$OPENAI_API_KEY"
          _upsert_secret OPENROUTER_API_KEY   "$OPENROUTER_API_KEY"
          _upsert_secret GEMINI_API_KEY       "$GEMINI_API_KEY"
          _upsert_secret TAVILY_API_KEY       "$TAVILY_API_KEY"
          _upsert_secret X_BEARER_TOKEN       "$X_BEARER_TOKEN"
          _upsert_secret COINGLASS_API_KEY    "$COINGLASS_API_KEY"
          _upsert_secret CRYPTOQUANT_API_KEY  "$CRYPTOQUANT_API_KEY"
          _upsert_secret FRED_API_KEY         "$FRED_API_KEY"
          _upsert_secret TELEGRAM_BOT_TOKEN   "$TELEGRAM_BOT_TOKEN"
          _upsert_secret TELEGRAM_CHAT_ID     "$TELEGRAM_CHAT_ID"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        env:
          IMAGE_NAME: ${{ env.CLOUD_RUN_SERVICE }}
        run: |
          IMAGE_URI=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${IMAGE_NAME}:$GITHUB_SHA
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Deploy to Cloud Run Job
        run: |
          # Secret Manager 金鑰已由上一步驟同步，此處直接引用 :latest 版本。
          SECRETS="XAI_API_KEY=XAI_API_KEY:latest"
          SECRETS="$SECRETS,OPENAI_API_KEY=OPENAI_API_KEY:latest"
          SECRETS="$SECRETS,OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest"
          SECRETS="$SECRETS,GEMINI_API_KEY=GEMINI_API_KEY:latest"
          SECRETS="$SECRETS,TAVILY_API_KEY=TAVILY_API_KEY:latest"
          SECRETS="$SECRETS,X_BEARER_TOKEN=X_BEARER_TOKEN:latest"
          SECRETS="$SECRETS,COINGLASS_API_KEY=COINGLASS_API_KEY:latest"
          SECRETS="$SECRETS,CRYPTOQUANT_API_KEY=CRYPTOQUANT_API_KEY:latest"
          SECRETS="$SECRETS,FRED_API_KEY=FRED_API_KEY:latest"
          SECRETS="$SECRETS,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest"
          SECRETS="$SECRETS,TELEGRAM_CHAT_ID=TELEGRAM_CHAT_ID:latest"

          # 若這些金鑰先前是以普通 env var 形式存在，先移除以允許升級為 secret 型態
          REMOVE_VARS="XAI_API_KEY,OPENAI_API_KEY,OPENROUTER_API_KEY,GEMINI_API_KEY"
          REMOVE_VARS="$REMOVE_VARS,TAVILY_API_KEY,X_BEARER_TOKEN,COINGLASS_API_KEY"
          REMOVE_VARS="$REMOVE_VARS,CRYPTOQUANT_API_KEY,FRED_API_KEY"
          REMOVE_VARS="$REMOVE_VARS,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID"

          gcloud run jobs deploy "${CLOUD_RUN_SERVICE}" \
            --image "$IMAGE_URI" \
            --region "${{ env.GCP_REGION }}" \
            --cpu 2 \
            --memory 2Gi \
            --task-timeout 3600 \
            --remove-env-vars="$REMOVE_VARS" \
            --set-secrets="$SECRETS" \
            --quiet
