name: CI/CD to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GCP_PROJECT_ID:    ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION:        asia-east1
  CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
  GAR_REPOSITORY:    ${{ secrets.GAR_REPOSITORY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        env:
          IMAGE_NAME: ${{ env.CLOUD_RUN_SERVICE }}
        run: |
          IMAGE_URI=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${IMAGE_NAME}:$GITHUB_SHA
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Deploy to Cloud Run Job
        run: |
          # 所有 API 金鑰透過 GCP Secret Manager 注入，不在 image 或 workflow 裡明文存放。
          # 前置作業：請在 GCP Secret Manager 建立以下 secret（名稱需與下方一致）：
          #   XAI_API_KEY, OPENAI_API_KEY, OPENROUTER_API_KEY, GEMINI_API_KEY,
          #   TAVILY_API_KEY, X_BEARER_TOKEN, COINGLASS_API_KEY,
          #   CRYPTOQUANT_API_KEY, FRED_API_KEY,
          #   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
          # Service Account 需要 roles/secretmanager.secretAccessor 權限。
          SECRETS="XAI_API_KEY=XAI_API_KEY:latest"
          SECRETS="$SECRETS,OPENAI_API_KEY=OPENAI_API_KEY:latest"
          SECRETS="$SECRETS,OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest"
          SECRETS="$SECRETS,GEMINI_API_KEY=GEMINI_API_KEY:latest"
          SECRETS="$SECRETS,TAVILY_API_KEY=TAVILY_API_KEY:latest"
          SECRETS="$SECRETS,X_BEARER_TOKEN=X_BEARER_TOKEN:latest"
          SECRETS="$SECRETS,COINGLASS_API_KEY=COINGLASS_API_KEY:latest"
          SECRETS="$SECRETS,CRYPTOQUANT_API_KEY=CRYPTOQUANT_API_KEY:latest"
          SECRETS="$SECRETS,FRED_API_KEY=FRED_API_KEY:latest"
          SECRETS="$SECRETS,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest"
          SECRETS="$SECRETS,TELEGRAM_CHAT_ID=TELEGRAM_CHAT_ID:latest"

          gcloud run jobs deploy "${CLOUD_RUN_SERVICE}" \
            --image "$IMAGE_URI" \
            --region "${{ env.GCP_REGION }}" \
            --cpu 2 \
            --memory 2Gi \
            --task-timeout 3600 \
            --set-secrets="$SECRETS" \
            --quiet
