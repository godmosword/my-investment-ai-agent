name: Deploy — Cloud Run Job

# - push main：變更執行相關檔案時自動部署（paths 與 ci.yml 對齊，純文件不觸發）
# - workflow_dispatch：隨時手動部署（仍先跑 ci.yml）
# 流程：先跑可重用的 ci.yml（Lint+Test），通過後才 build/push/deploy。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "assets_config.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-main-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID:    ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION:        asia-east1
  CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE || 'my-investment-ai-agent' }}
  GAR_REPOSITORY:    ${{ secrets.GAR_REPOSITORY }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: [test]
    runs-on: ubuntu-22.04
    # 於 GitHub Repo → Settings → Environments → production 設定 Required reviewers 後，
    # 本 job 會在部署前等待人工核准（阻斷「綠 CI 即上線」）。
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Free disk space on runner
        run: |
          set -eux
          sudo docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_BASE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}"
          IMAGE_URI="${IMAGE_BASE}:${GITHUB_SHA}"
          IMAGE_LATEST="${IMAGE_BASE}:latest"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          docker build -t "${IMAGE_URI}" -t "${IMAGE_LATEST}" .
          docker push "${IMAGE_URI}"
          docker push "${IMAGE_LATEST}"
          docker builder prune -af || true
          docker system prune -af || true
          df -h

      - name: Deploy to Cloud Run Job
        run: |
          # Secret Manager 金鑰已由上一步驟同步，此處直接引用 :latest 版本。
          SECRETS="XAI_API_KEY=XAI_API_KEY:latest"
          SECRETS="$SECRETS,OPENAI_API_KEY=OPENAI_API_KEY:latest"
          SECRETS="$SECRETS,OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest"
          SECRETS="$SECRETS,GEMINI_API_KEY=GEMINI_API_KEY:latest"
          SECRETS="$SECRETS,APIFY_API_TOKEN=APIFY_API_TOKEN:latest"
          SECRETS="$SECRETS,TAVILY_API_KEY=TAVILY_API_KEY:latest"
          SECRETS="$SECRETS,X_BEARER_TOKEN=X_BEARER_TOKEN:latest"
          SECRETS="$SECRETS,COINGLASS_API_KEY=COINGLASS_API_KEY:latest"
          SECRETS="$SECRETS,CRYPTOQUANT_API_KEY=CRYPTOQUANT_API_KEY:latest"
          SECRETS="$SECRETS,FRED_API_KEY=FRED_API_KEY:latest"
          SECRETS="$SECRETS,FINANCIAL_DATASETS_API_KEY=FINANCIAL_DATASETS_API_KEY:latest"
          SECRETS="$SECRETS,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest"
          SECRETS="$SECRETS,TELEGRAM_CHAT_ID=TELEGRAM_CHAT_ID:latest"

          # 若這些金鑰先前是以普通 env var 形式存在，先移除以允許升級為 secret 型態。
          # 注意：首次部署時不要加 --remove-env-vars，否則會因變數尚不存在而失敗。
          # 後續更新若要清除舊的明文 env var，可取消下方 REMOVE_VARS 與對應參數的註解。
          # REMOVE_VARS="XAI_API_KEY,OPENAI_API_KEY,OPENROUTER_API_KEY,GEMINI_API_KEY"
          # REMOVE_VARS="$REMOVE_VARS,TAVILY_API_KEY,X_BEARER_TOKEN,COINGLASS_API_KEY"
          # REMOVE_VARS="$REMOVE_VARS,CRYPTOQUANT_API_KEY,FRED_API_KEY,FINANCIAL_DATASETS_API_KEY"
          # REMOVE_VARS="$REMOVE_VARS,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID"

          gcloud run jobs deploy "${CLOUD_RUN_SERVICE}" \
            --image "$IMAGE_URI" \
            --region "${{ env.GCP_REGION }}" \
            --service-account="${{ secrets.GCP_RUNTIME_SA_EMAIL }}" \
            --cpu 2 \
            --memory 2Gi \
            --task-timeout 3600 \
            --set-secrets="$SECRETS" \
            --quiet
