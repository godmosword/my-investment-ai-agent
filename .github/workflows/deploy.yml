name: Deploy to GCP Cloud Run Job

on:
  push:
    branches:
      - main # 當代碼推送到 main 分支時，就會觸發自動更新

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Auth
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -t asia-east1-docker.pkg.dev/my-investment-ai-agent/my-repo/investment-agent:latest .
          docker push asia-east1-docker.pkg.dev/my-investment-ai-agent/my-repo/investment-agent:latest

      - name: Update Cloud Run Job
        run: |
          gcloud run jobs update daily-research-report \
            --image asia-east1-docker.pkg.dev/my-investment-ai-agent/my-repo/investment-agent:latest \
            --region asia-east1
